name: EBPF-CI
on:
  push:
    branches:
      - Alpha
  pull_request:
    branches:
      - Alpha

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  # ---- Linux (eBPF 编译 + Go build + test) ----
  linux-amd64:
    runs-on: ubuntu-latest
    env: { CGO_ENABLED: 0, GOTOOLCHAIN: auto }
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
      with: { go-download-base-url: 'https://github.com/MetaCubeX/go/releases/download/build', go-version: '1.26' }
    - run: sudo apt-get update && sudo apt-get install -y clang libbpf-dev
    - run: make ebpf CLANG=clang
    - run: go build -v -trimpath -ldflags "-w -s -buildid=" -tags with_gvisor
    - run: go test ./... -count=1

  linux-arm64:
    runs-on: ubuntu-24.04-arm
    env: { CGO_ENABLED: 0, GOTOOLCHAIN: auto }
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
      with: { go-download-base-url: 'https://github.com/MetaCubeX/go/releases/download/build', go-version: '1.26' }
    - run: sudo apt-get update && sudo apt-get install -y clang libbpf-dev
    - run: make ebpf CLANG=clang
    - run: go build -v -trimpath -ldflags "-w -s -buildid=" -tags with_gvisor

  linux-386:
    runs-on: ubuntu-latest
    env: { GOARCH: '386', CGO_ENABLED: 0, GOTOOLCHAIN: auto }
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
      with: { go-download-base-url: 'https://github.com/MetaCubeX/go/releases/download/build', go-version: '1.26' }
    - run: go build -v -trimpath -ldflags "-w -s -buildid="

  linux-armv7:
    runs-on: ubuntu-latest
    env: { GOARCH: arm, GOARM: '7', CGO_ENABLED: 0, GOTOOLCHAIN: auto }
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
      with: { go-download-base-url: 'https://github.com/MetaCubeX/go/releases/download/build', go-version: '1.26' }
    - run: go build -v -trimpath -ldflags "-w -s -buildid="

  linux-mipsle:
    runs-on: ubuntu-latest
    env: { GOARCH: mipsle, GOMIPS: softfloat, CGO_ENABLED: 0, GOTOOLCHAIN: auto }
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
      with: { go-download-base-url: 'https://github.com/MetaCubeX/go/releases/download/build', go-version: '1.26' }
    - run: go build -v -trimpath -ldflags "-w -s -buildid="

  linux-riscv64:
    runs-on: ubuntu-latest
    env: { GOARCH: riscv64, CGO_ENABLED: 0, GOTOOLCHAIN: auto }
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
      with: { go-download-base-url: 'https://github.com/MetaCubeX/go/releases/download/build', go-version: '1.26' }
    - run: go build -v -trimpath -ldflags "-w -s -buildid="

  # ---- macOS (stub 编译) ----
  darwin:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    env: { GOOS: darwin, CGO_ENABLED: 0, GOTOOLCHAIN: auto }
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
      with: { go-download-base-url: 'https://github.com/MetaCubeX/go/releases/download/build', go-version: '1.26' }
    - run: GOARCH=${{ matrix.goarch }} go build -v -trimpath -ldflags "-w -s -buildid="

  # ---- Windows (stub 编译) ----
  windows:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64, '386']
    env: { GOOS: windows, CGO_ENABLED: 0, GOTOOLCHAIN: auto }
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
      with: { go-download-base-url: 'https://github.com/MetaCubeX/go/releases/download/build', go-version: '1.26' }
    - run: GOARCH=${{ matrix.goarch }} go build -v -trimpath -ldflags "-w -s -buildid="

  # ---- Other platforms (stub 编译，保持最初行为) ----
  freebsd:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64, '386']
    env: { GOOS: freebsd, CGO_ENABLED: 0, GOTOOLCHAIN: auto }
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
      with: { go-download-base-url: 'https://github.com/MetaCubeX/go/releases/download/build', go-version: '1.26' }
    - run: GOARCH=${{ matrix.goarch }} go build -v -trimpath -ldflags "-w -s -buildid="

  android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [arm64]
    env: { GOOS: android, CGO_ENABLED: 0, GOTOOLCHAIN: auto }
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
      with: { go-download-base-url: 'https://github.com/MetaCubeX/go/releases/download/build', go-version: '1.26' }
    - run: GOARCH=${{ matrix.goarch }} go build -v -trimpath -ldflags "-w -s -buildid="
