name: EBPF-CI
on:
  push:
    branches:
      - Alpha
  pull_request:
    branches:
      - Alpha

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  # ---- Linux (eBPF 编译 + Go build，测试仅 amd64) ----
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [amd64, '386', armv7, arm64, mipsle, riscv64]
    env:
      CGO_ENABLED: 0
      GOTOOLCHAIN: auto
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
      with:
        go-download-base-url: 'https://github.com/MetaCubeX/go/releases/download/build'
        go-version: '1.26'
    - run: sudo apt-get update && sudo apt-get install -y clang libbpf-dev
    - run: make ebpf CLANG=clang
    - name: Build
      run: |
        case "${{ matrix.target }}" in
          amd64)   GOARCH=amd64   GOAMD64=v3  go build -v -trimpath -ldflags "-w -s -buildid=" -tags with_gvisor ;;
          386)     GOARCH=386                  go build -v -trimpath -ldflags "-w -s -buildid=" ;;
          armv7)   GOARCH=arm    GOARM=7       go build -v -trimpath -ldflags "-w -s -buildid=" ;;
          arm64)   GOARCH=arm64                go build -v -trimpath -ldflags "-w -s -buildid=" ;;
          mipsle)  GOARCH=mipsle GOMIPS=softfloat go build -v -trimpath -ldflags "-w -s -buildid=" ;;
          riscv64) GOARCH=riscv64              go build -v -trimpath -ldflags "-w -s -buildid=" ;;
        esac
    - name: Test (amd64 only)
      if: ${{ matrix.target == 'amd64' }}
      run: go test ./... -count=1

  # ---- macOS (stub 编译) ----
  darwin:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    env: { GOOS: darwin, CGO_ENABLED: 0, GOTOOLCHAIN: auto }
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
      with: { go-download-base-url: 'https://github.com/MetaCubeX/go/releases/download/build', go-version: '1.26' }
    - run: GOARCH=${{ matrix.goarch }} go build -v -trimpath -ldflags "-w -s -buildid="

  # ---- Windows (stub 编译) ----
  windows:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64, '386']
    env: { GOOS: windows, CGO_ENABLED: 0, GOTOOLCHAIN: auto }
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
      with: { go-download-base-url: 'https://github.com/MetaCubeX/go/releases/download/build', go-version: '1.26' }
    - run: GOARCH=${{ matrix.goarch }} go build -v -trimpath -ldflags "-w -s -buildid="

  # ---- Other platforms (stub 编译，保持最初行为) ----
  freebsd:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64, '386']
    env: { GOOS: freebsd, CGO_ENABLED: 0, GOTOOLCHAIN: auto }
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
      with: { go-download-base-url: 'https://github.com/MetaCubeX/go/releases/download/build', go-version: '1.26' }
    - run: GOARCH=${{ matrix.goarch }} go build -v -trimpath -ldflags "-w -s -buildid="

  android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [arm64]
    env: { GOOS: android, CGO_ENABLED: 0, GOTOOLCHAIN: auto }
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
      with: { go-download-base-url: 'https://github.com/MetaCubeX/go/releases/download/build', go-version: '1.26' }
    - run: GOARCH=${{ matrix.goarch }} go build -v -trimpath -ldflags "-w -s -buildid="
